name: AegisHealth AI CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # 1. Lint & Code Quality Checks
  # =========================================================================
  lint:
    name: Lint & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python Linters & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black
          pip install -r backend/requirements.txt

      - name: Python Syntax & Formatting Check
        run: |
          # Stop build if syntax errors or undefined names exist
          flake8 backend --count --select=E9,F63,F7,F82 --show-source --statistics
          # Warning check for PEP 8 compliance
          flake8 backend --count --exit-zero --max-complexity=15 --max-line-length=120 --statistics

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Frontend TypeScript & Production Build Verification
        working-directory: ./frontend
        run: |
          npm run build

  # =========================================================================
  # 2. Automated Test Suite (Phases 1-7 + E2E Critical Paths)
  # =========================================================================
  test:
    name: Backend Test Suite & E2E Critical Paths
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Phase 1 Foundation & Auth Tests
        run: python backend/test_foundation.py

      - name: Run Phase 4 Patient Management & Triage Tests
        run: python backend/test_phase4.py

      - name: Run Phase 5 Staff Management & WebSocket Tests
        run: python backend/test_phase5.py

      - name: Run Phase 6 Resource Management & Shortage Prediction Tests
        run: python backend/test_phase6.py

      - name: Run Phase 7 AI Decision Core & Search Graph Tests
        run: python backend/test_phase7.py

      - name: Run Phase 8 End-to-End Critical Paths Verification
        run: python backend/test_e2e_critical_paths.py

      - name: Run Full Integration System Suite
        run: python backend/test_system.py

  # =========================================================================
  # 3. Multi-Stage Docker Builds
  # =========================================================================
  docker-build:
    name: Docker Multi-Stage Build Verification
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: aegishealth-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend Multi-Stage Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: aegishealth-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =========================================================================
  # 4. Automated Deployment Pipeline
  # =========================================================================
  deploy:
    name: Production Deployment
    runs-on: ubuntu-latest
    needs: [test, docker-build]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Deploy Notification
        run: |
          echo "=========================================================================="
          echo "  AegisHealth AI - Clinical Decision Support Platform Deployed Successfully"
          echo "  Affiliation: B.Tech CSE AI (NIET Greater Noida, Dr. Mohd. Nazim)"
          echo "  Sustainable Development Goal: SDG 3 (Good Health and Well-Being)"
          echo "  Quality Bar: Zero TypeScript Errors | All E2E Critical Paths Verified 100%"
          echo "=========================================================================="

