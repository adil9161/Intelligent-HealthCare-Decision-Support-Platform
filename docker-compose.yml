version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: aegishealth_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aegis_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aegis_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-aegis_health_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis_user -d aegis_health_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aegishealth_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://aegis_user:aegis_password_2026@db:5432/aegis_health_db
      - SECRET_KEY=niet_cse_ai_healthcare_secret_key_2026_sdg3_production
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aegishealth_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "3000:80"

volumes:
  postgres_data:

